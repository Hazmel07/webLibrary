services:
  backend:
    build:
      context: ./backend
    container_name: book_showcase_backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "change-me-for-school-project"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - sqlite_data:/app/data
    command: >
      sh -c "mkdir -p /app/data &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: book_showcase_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlite_data:
